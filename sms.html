<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar SMS</title>
<style>
  :root{
    --bg:#16222a; --panel:#1e2f3a; --ink:#eef3f5; --muted:#9db0ba;
    --line:#35505f; --accent:#f2c14e; --ok:#7bd3a0; --err:#ff8a80;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;
    background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
  main{width:100%;max-width:30rem;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:2rem}
  h1{margin:0 0 .4rem;font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
  p.sub{margin:0 0 1.6rem;color:var(--muted);line-height:1.5;font-size:.95rem}
  label{display:block;margin:1rem 0 .35rem;font-size:.9rem;color:var(--muted)}
  input,textarea{width:100%;padding:.75rem .85rem;border-radius:8px;border:1px solid var(--line);
    background:#12202a;color:var(--ink);font:inherit;font-size:1rem}
  textarea{resize:vertical;min-height:7rem}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{text-align:right;font-size:.8rem;color:var(--muted);margin-top:.25rem}
  button{margin-top:1.3rem;width:100%;padding:.85rem;border:0;border-radius:8px;
    background:var(--accent);color:#1b1b1b;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  #estado{margin-top:1rem;min-height:1.4rem;font-size:.95rem;line-height:1.4}
  .ok{color:var(--ok)} .err{color:var(--err)}
  small{display:block;margin-top:1.4rem;color:var(--muted);font-size:.8rem;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Enviar SMS</h1>
  <p class="sub">Escribe el número con código de país y tu mensaje. El destinatario verá el SMS desde un número del servicio, no desde el tuyo.</p>

  <label for="numero">Número de destino</label>
  <input id="numero" type="tel" inputmode="tel" placeholder="+56912345678" autocomplete="off">

  <label for="mensaje">Mensaje</label>
  <textarea id="mensaje" maxlength="160" placeholder="Escribe tu mensaje (máx. 160 caracteres)"></textarea>
  <div class="count"><span id="n">0</span>/160</div>

  <button id="enviar">Enviar SMS</button>
  <div id="estado" role="status" aria-live="polite"></div>

  <small>El plan gratuito de Textbelt permite 1 SMS por día por conexión a internet. Envía mensajes solo a personas que aceptaron recibirlos.</small>
</main>

<script>
  const numero = document.getElementById("numero");
  const mensaje = document.getElementById("mensaje");
  const contador = document.getElementById("n");
  const boton = document.getElementById("enviar");
  const estado = document.getElementById("estado");

  mensaje.addEventListener("input", () => contador.textContent = mensaje.value.length);

  function mostrar(texto, clase){
    estado.textContent = texto;
    estado.className = clase || "";
  }

  boton.addEventListener("click", async () => {
    const tel = numero.value.replace(/[\s-]/g, "");
    const texto = mensaje.value.trim();

    if (!/^\+\d{8,15}$/.test(tel)) {
      mostrar("Ingresa el número con + y código de país, por ejemplo +56912345678.", "err");
      return;
    }
    if (!texto) {
      mostrar("Escribe un mensaje antes de enviar.", "err");
      return;
    }

    boton.disabled = true;
    mostrar("Enviando…");

    try {
      // URL real de tu Cloudflare Worker
      const resp = await fetch("https://sms-proxy.ignaciocalderon-1805.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: tel, message: texto })
      });
      const datos = await resp.json();

      if (datos.success) {
        mostrar("SMS enviado.", "ok");
        mensaje.value = "";
        contador.textContent = "0";
      } else {
        mostrar("No se pudo enviar: " + (datos.quotaRemaining === 0 ? "Límite gratuito alcanzado por hoy." : (datos.error || "error desconocido")), "err");
      }
    } catch (e) {
      mostrar("Error de conexión. Revisa tu internet e inténtalo de nuevo.", "err");
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
